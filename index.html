<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layerline — Made-to-order 3D prints</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg: #f7f2e6;
    --paper: #fffdf8;
    --paper-2: #efe6d2;
    --line: #ddd0ac;
    --ink: #26221a;
    --ink-dim: #7c735d;
    --blue: #5b93b0;
    --blue-deep: #2c6480;
    --blue-pale: #dfeaef;
    --ok: #3f8f63;
    --danger: #b1553f;
    --radius: 4px;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Space Mono', Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55;}
  a{color:inherit;}
  img{display:block; max-width:100%;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  .tag{font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-transform:uppercase;}

  /* ---------- NAV ---------- */
  header.nav{position:sticky; top:0; z-index:40; background:rgba(247,242,230,0.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:18px 28px;}
  .brand{font-family:var(--serif); font-style:italic; font-weight:600; font-size:23px;}
  .nav-links{display:flex; gap:30px; font-size:14px; color:var(--ink-dim);}
  .nav-links a{text-decoration:none;}
  .nav-links a:hover{color:var(--ink);}
  .cart-btn{
    display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line);
    padding:9px 16px; border-radius:20px; font-size:14px; position:relative;
  }
  .cart-btn:hover{border-color:var(--blue-deep);}
  .cart-count{
    background:var(--blue-deep); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 4px;
  }

  /* ---------- HERO ---------- */
  .hero{padding:76px 0 90px; border-bottom:1px solid var(--line); overflow:hidden;}
  .hero-grid{display:grid; grid-template-columns:1.1fr 0.9fr; gap:50px; align-items:center;}
  .eyebrow{color:var(--blue-deep); font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:18px;}
  .hero h1{font-family:var(--serif); font-weight:600; font-size:clamp(38px,4.6vw,60px); line-height:1.05; letter-spacing:-0.01em; margin-bottom:22px;}
  .hero h1 em{font-style:italic; color:var(--blue-deep); font-weight:500;}
  .hero p.sub{color:var(--ink-dim); font-size:17px; max-width:460px; margin-bottom:30px;}
  .hero-cta{display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:var(--sans); font-size:14px; font-weight:600; padding:13px 24px; border-radius:24px;
    border:1px solid transparent; text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    transition:transform .12s, background .15s, border-color .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--blue-deep); color:#fff;}
  .btn-primary:hover{background:#204d63;}
  .btn-ghost{border-color:var(--ink); color:var(--ink); background:transparent;}
  .btn-ghost:hover{background:var(--ink); color:var(--paper);}
  .btn-outline{border-color:var(--line); color:var(--ink); background:var(--paper);}
  .btn-outline:hover{border-color:var(--blue-deep);}
  .btn-block{width:100%; justify-content:center;}

  .collage{position:relative; height:420px;}
  .photo{
    position:absolute; width:180px; aspect-ratio:1/1; border:6px solid var(--paper); border-radius:2px;
    box-shadow:0 10px 26px rgba(38,34,26,0.16); overflow:hidden; background:var(--paper-2);
  }
  .photo img{width:100%; height:100%; object-fit:cover;}
  .p1{top:0; left:30px; width:210px; transform:rotate(-6deg); z-index:3;}
  .p2{top:40px; right:0; width:170px; transform:rotate(5deg); z-index:2;}
  .p3{bottom:30px; left:0; width:160px; transform:rotate(4deg); z-index:2;}
  .p4{bottom:0; right:40px; width:190px; transform:rotate(-4deg); z-index:1;}
  .p5{top:170px; left:150px; width:150px; transform:rotate(-2deg); z-index:4;}

  /* ---------- HOW IT WORKS ---------- */
  .steps{padding:64px 0; border-bottom:1px solid var(--line);}
  .steps h2{font-family:var(--serif); font-size:26px; margin-bottom:34px;}
  .steps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:36px;}
  .step .num{font-family:var(--serif); font-style:italic; font-size:34px; color:var(--blue); margin-bottom:10px; line-height:1;}
  .step h3{font-size:16px; font-weight:600; margin-bottom:8px;}
  .step p{color:var(--ink-dim); font-size:14px;}

  /* ---------- SHOP ---------- */
  .shop{padding:70px 0 110px;}
  .shop-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:6px;}
  .shop-head h2{font-family:var(--serif); font-size:32px;}
  .shop-head p{color:var(--ink-dim); font-size:14px; max-width:420px;}
  .shop-note{font-size:13px; color:var(--ink-dim); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:14px 0; margin:26px 0 38px;}
  .shop-note b{color:var(--ink);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:26px;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; overflow:hidden;}
  .thumb{position:relative; display:block; aspect-ratio:1/1; overflow:hidden; background:var(--paper-2);}
  .thumb img{width:100%; height:100%; object-fit:cover; transition:transform .4s;}
  .thumb:hover img{transform:scale(1.04);}
  .card-body{padding:18px 18px 20px; display:flex; flex-direction:column; gap:11px; flex:1;}
  .card-title{font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.3;}
  .source-link{font-size:12px; color:var(--ink-dim); text-decoration:none; display:inline-flex; align-items:center; gap:4px;}
  .source-link:hover{color:var(--blue-deep);}
  .blurb{font-size:13px; color:var(--ink-dim); flex:1;}
  .chip{display:inline-block; background:var(--blue-pale); color:var(--blue-deep); font-family:var(--mono); font-size:10px; padding:4px 9px; border-radius:12px; letter-spacing:.02em; width:fit-content;}

  .opt-label{font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:7px;}
  .swatches{display:flex; gap:8px; margin-bottom:14px;}
  .swatch{width:22px; height:22px; border-radius:50%; border:2px solid transparent; outline:1px solid var(--line); outline-offset:2px; cursor:pointer;}
  .swatch.active{border-color:var(--ink);}

  .row-between{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .qty{display:flex; align-items:center; border:1px solid var(--line); border-radius:20px;}
  .qty button{background:none; border:none; color:var(--ink); width:28px; height:28px; font-size:15px;}
  .qty button:hover{color:var(--blue-deep);}
  .qty span{width:24px; text-align:center; font-size:13px;}
  .price{font-family:var(--serif); font-weight:600; font-size:18px;}
  .price small{color:var(--ink-dim); font-weight:400; font-size:11px; font-family:var(--sans);}

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line); padding:50px 0;}
  footer .brand{margin-bottom:12px;}
  footer p{color:var(--ink-dim); font-size:13px; max-width:440px;}
  footer .fine{font-family:var(--mono); font-size:11px; color:#a89a76; margin-top:16px; max-width:520px;}

  /* ---------- CART DRAWER ---------- */
  .scrim{position:fixed; inset:0; background:rgba(38,34,26,0.4); opacity:0; pointer-events:none; transition:opacity .2s; z-index:90;}
  .scrim.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(420px,100%); background:var(--paper);
    box-shadow:-12px 0 30px rgba(38,34,26,0.15); transform:translateX(100%); transition:transform .25s ease;
    z-index:91; display:flex; flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px solid var(--line);}
  .drawer-head h2{font-family:var(--serif); font-size:22px;}
  .drawer-close{background:none; border:none; font-size:22px; color:var(--ink-dim); line-height:1;}
  .drawer-close:hover{color:var(--ink);}
  .drawer-body{flex:1; overflow-y:auto; padding:20px 24px;}
  .drawer-foot{border-top:1px solid var(--line); padding:20px 24px;}

  .empty-cart{color:var(--ink-dim); font-size:14px; padding:40px 0; text-align:center;}

  .line-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
  .line-item img{width:64px; height:64px; object-fit:cover; border-radius:3px; flex-shrink:0;}
  .line-info{flex:1; min-width:0;}
  .line-title{font-size:14px; font-weight:600; margin-bottom:2px;}
  .line-meta{font-size:12px; color:var(--ink-dim); margin-bottom:8px;}
  .line-row{display:flex; align-items:center; justify-content:space-between;}
  .remove-btn{background:none; border:none; color:var(--danger); font-size:12px; text-decoration:underline;}
  .line-price{font-family:var(--serif); font-weight:600; font-size:14px;}

  .cart-total-row{display:flex; justify-content:space-between; font-family:var(--serif); font-size:20px; font-weight:600; margin-bottom:16px;}

  /* ---------- CHECKOUT VIEW ---------- */
  .co-section{margin-bottom:22px;}
  .co-label{font-size:12px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--ink); padding:10px 12px; font-family:var(--sans); font-size:14px; resize:vertical;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--blue-deep);}

  .pay-options{display:flex; flex-direction:column; gap:12px;}
  .pay-card{border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .pay-card.recommended{border-color:var(--blue-deep); background:var(--blue-pale);}
  .pay-card h4{font-size:14px; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
  .pay-card p{font-size:12.5px; color:var(--ink-dim); margin-bottom:12px;}
  .badge-rec{background:var(--blue-deep); color:#fff; font-size:10px; padding:2px 8px; border-radius:10px; font-family:var(--mono);}
  .etransfer-details{font-size:13px; color:var(--ink-dim);}
  .etransfer-details code{background:var(--paper); padding:2px 6px; border-radius:3px; color:var(--blue-deep); font-family:var(--mono); border:1px solid var(--line);}
  .modal-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .modal-actions .btn{flex:1;}
  .toast{font-size:12px; color:var(--ok); margin-top:8px; display:none;}
  .toast.show{display:block;}
  .back-link{font-size:13px; color:var(--ink-dim); text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:16px;}
  .back-link:hover{color:var(--ink);}

  @media (max-width:860px){
    .hero-grid{grid-template-columns:1fr;}
    .collage{height:300px; margin-top:10px;}
    .steps-grid{grid-template-columns:1fr;}
    .nav-links{display:none;}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">Layerline</div>
    <nav class="nav-links">
      <a href="#shop">Shop</a>
      <a href="#how">How it works</a>
      <a href="#contact">Contact</a>
    </nav>
    <button class="cart-btn" id="open-cart">
      Cart <span class="cart-count" id="cart-count">0</span>
    </button>
  </div>
</header>

<section
